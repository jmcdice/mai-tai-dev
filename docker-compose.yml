services:
  postgres:
    image: postgres:16-alpine
    container_name: maitai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maitai}
      # No default on purpose. A baked-in default password is a published
      # credential — the fallback that used to live here is what ended up
      # running on the dev host, reachable from the LAN. Fail loudly instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-maitai}
    ports:
      # Loopback only. The agents network is deliberately routed away from
      # postgres — but a 0.0.0.0 publish hands it straight back via the host
      # IP, and takes the rest of the LAN along with it.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maitai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maitai-backend
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.config/mai-tai:/host-mai-tai-config:ro
      - ${HOME}/.config/gcloud:/host-gcloud:ro
    environment:
      - PORT=8000
      # Apple Silicon: /proc/cpuinfo inside a Linux VM advertises sve2, which
      # the host does not actually implement, so OpenSSL picks an SVE2 code
      # path and every worker dies with SIGILL the moment app.core.crypto
      # derives a key. Pinning the capability mask forces the safe path.
      # Read only on ARM builds of OpenSSL — a no-op on x86_64.
      - OPENSSL_armcap=${OPENSSL_armcap:-0xfff}
      # Vertex AI fallback for agent containers. The backend reads the host's
      # ADC from the /host-gcloud mount and passes it to agents as JSON.
      - CLAUDE_CODE_USE_VERTEX=${CLAUDE_CODE_USE_VERTEX:-}
      - ANTHROPIC_VERTEX_PROJECT_ID=${ANTHROPIC_VERTEX_PROJECT_ID:-}
      - CLOUD_ML_REGION=${CLOUD_ML_REGION:-global}
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-maitai}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-maitai}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - EXTRA_CORS_ORIGIN=${EXTRA_CORS_ORIGIN:-}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
      - AGENT_IMAGE=${AGENT_IMAGE:-mai-tai-agent:latest}
      - AGENT_MODEL=${AGENT_MODEL:-}
      # Agents get their own network: they can reach the backend (and the
      # internet) but NOT postgres or other infra containers.
      - AGENT_NETWORK=mai-tai-dev_agents
    networks:
      - default
      - agents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: maitai-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - INTERNAL_API_URL=http://backend:8000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      - backend
    restart: unless-stopped

  # --- Edge services: opt-in via `--profile edge` -------------------------
  #
  # These two only make sense on a host that fronts mai-tai.dev: dnsmasq binds
  # a specific LAN address, and caddy serves certificates issued out-of-band
  # by acme.sh into a gitignored directory. On any other machine they cannot
  # possibly start, and before the profile they still tried — a fresh clone
  # came up with two containers in a permanent restart loop and no explanation
  # of which ones were supposed to be there.
  dnsmasq:
    profiles: ["edge"]
    build:
      context: ./infra
      dockerfile: Dockerfile.dnsmasq
    container_name: maitai-dnsmasq
    network_mode: host
    environment:
      # The address dnsmasq binds and hands out for *.mai-tai.dev. Must be an
      # address that exists on this host. Deliberately not guarded with ":?"
      # here — compose interpolates every service regardless of profile, so a
      # required-variable guard would break the default stack for everyone.
      # The entrypoint enforces it instead, where it only runs if the edge
      # profile actually starts this container.
      - DNSMASQ_LISTEN_ADDRESS=${DNSMASQ_LISTEN_ADDRESS:-}
    volumes:
      - ./infra/dnsmasq.conf.template:/etc/dnsmasq.conf.template:ro
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  caddy:
    profiles: ["edge"]
    image: caddy:latest
    container_name: maitai-caddy
    ports:
      - "8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

networks:
  default:
  # Isolated network for spawned agent containers. Agents run LLM-driven code
  # with broad permissions; keeping postgres off this network means a
  # misbehaving agent can only talk to the backend API (and the internet).
  agents:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
